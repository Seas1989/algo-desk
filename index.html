<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      // 早于样式执行：决定并打上 data-theme，避免刷新闪白
      (function () {
        var pref = 'auto';
        try { pref = localStorage.getItem('algodesk.theme') || 'auto'; } catch (e) {}
        var t = pref === 'auto'
          ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          : pref;
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>算法训练台 · CF × 洛谷</title>
    <meta name="description" content="把 Codeforces 和洛谷的账号、比赛、欠账的题放在一张桌子上：未完成的比赛题、即将开始的比赛、按难度和算法分好的题单。" />
    <meta name="theme-color" content="#0a0e14" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234ea1ff'/%3E%3Ctext x='16' y='22' font-size='15' font-family='monospace' text-anchor='middle' fill='%230a0e14'%3E%3C/%3E%3C/text%3E%3C/svg%3E" />
    <meta property="og:title" content="算法训练台 · CF × 洛谷" />
    <meta property="og:description" content="比赛倒计时、半途而废的比赛、没过的题、按难度和算法排好的题单。" />
    <meta property="og:type" content="website" />
  </head>

  </body>
</html>
