name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # UTC 22:00 = 北京时间 06:00，每天刷新一次数据
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 抓取失败不阻断部署，直接沿用仓库里已有的 public/data
      # fetch:all = 主账号快照 + config.json 里额外收录的洛谷用户
      - name: Fetch latest data
        run: npm run fetch:all
        continue-on-error: true

      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
